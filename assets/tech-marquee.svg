<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Tecnologías: HTML, CSS, JavaScript, TypeScript, React, Angular, Vue, Vite, Git, GitHub, Node.js">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge">
      <rect width="1200" height="90" fill="url(#fade)"/>
    </mask>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A9BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A9BFF"/>
      <stop offset="1" stop-color="#00E0B8" stop-opacity="0"/>
    </linearGradient>
    <g id="pills" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
      <g transform="translate(0 0)"><rect x="0" y="22" width="150" height="46" rx="23" fill="#161B22" stroke="#E34F26" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#E34F26"/><text x="86" y="51" fill="#E6EDF3">HTML</text></g>
      <g transform="translate(170 0)"><rect x="0" y="22" width="150" height="46" rx="23" fill="#161B22" stroke="#1572B6" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#1572B6"/><text x="86" y="51" fill="#E6EDF3">CSS</text></g>
      <g transform="translate(340 0)"><rect x="0" y="22" width="190" height="46" rx="23" fill="#161B22" stroke="#F7DF1E" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#F7DF1E"/><text x="108" y="51" fill="#E6EDF3">JavaScript</text></g>
      <g transform="translate(550 0)"><rect x="0" y="22" width="190" height="46" rx="23" fill="#161B22" stroke="#3178C6" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#3178C6"/><text x="108" y="51" fill="#E6EDF3">TypeScript</text></g>
      <g transform="translate(760 0)"><rect x="0" y="22" width="150" height="46" rx="23" fill="#161B22" stroke="#61DAFB" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#61DAFB"/><text x="86" y="51" fill="#E6EDF3">React</text></g>
      <g transform="translate(930 0)"><rect x="0" y="22" width="160" height="46" rx="23" fill="#161B22" stroke="#DD0031" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#DD0031"/><text x="92" y="51" fill="#E6EDF3">Angular</text></g>
      <g transform="translate(1110 0)"><rect x="0" y="22" width="130" height="46" rx="23" fill="#161B22" stroke="#42B883" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#42B883"/><text x="76" y="51" fill="#E6EDF3">Vue</text></g>
      <g transform="translate(1260 0)"><rect x="0" y="22" width="130" height="46" rx="23" fill="#161B22" stroke="#9467FF" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#9467FF"/><text x="76" y="51" fill="#E6EDF3">Vite</text></g>
      <g transform="translate(1410 0)"><rect x="0" y="22" width="120" height="46" rx="23" fill="#161B22" stroke="#F05032" stroke-opacity="0.7"/><circle cx="26" cy="45" r="6" fill="#F05032"/><text x="72" y="51" fill="#E6EDF3">Git</text></g>
      <g transform="translate(1550 0)"><rect x="0" y="22" width="160" height="46" rx="23" fill="#161B22" stroke="#C9D1D9" stroke-opacity="0.6"/><circle cx="26" cy="45" r="6" fill="#C9D1D9"/><text x="92" y="51" fill="#E6EDF3">GitHub</text></g>
      <g transform="translate(1730 0)"><rect x="0" y="22" width="220" height="46" rx="23" fill="#161B22" stroke="#5FA04E" stroke-opacity="0.7" stroke-dasharray="5 4"/><circle cx="26" cy="45" r="6" fill="#5FA04E"/><text x="126" y="51" fill="#E6EDF3">Node.js · aprendiendo</text></g>
    </g>
  </defs>

  <rect width="1200" height="90" rx="18" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="1199" height="89" rx="17.5" fill="none" stroke="#30363D"/>

  <g mask="url(#edge)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1970 0" dur="38s" repeatCount="indefinite"/>
      <use href="#pills" x="20"/>
      <use href="#pills" x="1990"/>
      <use href="#pills" x="3960"/>
    </g>
  </g>

  <rect x="120" y="86" width="960" height="2" fill="url(#line)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
