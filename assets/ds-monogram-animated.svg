    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="44" fill="#0D1117"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#0A9BFF" stroke-opacity="0.35" stroke-width="2">
    <animate attributeName="r" values="42;46;42" dur="3s" repeatCount="indefinite"/>
