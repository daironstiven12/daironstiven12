<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350" width="1400" height="350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Dairon Stiven Orejuela Palacios, desarrollo web e ingeniería de software</title>
  <desc id="d">Banner animado azul marino con el monograma DS, el nombre Dairon Stiven Orejuela Palacios y la descripción desarrollo web e ingeniería de software, junto a los frameworks React, Angular y Vue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010D1B"/><stop offset="1" stop-color="#02132D"/></linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.8" r="0.45"><stop offset="0" stop-color="#0A4FB5" stop-opacity=".5"/><stop offset="1" stop-color="#0A4FB5" stop-opacity="0"/></radialGradient>
    <linearGradient id="corner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0061D8"/><stop offset="1" stop-color="#0061D8" stop-opacity="0"/></linearGradient>
    <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5BB8FF" stop-opacity="0"/><stop offset=".5" stop-color="#5BB8FF" stop-opacity=".16"/><stop offset="1" stop-color="#5BB8FF" stop-opacity="0"/></linearGradient>
    <style>
      @media (prefers-reduced-motion:no-preference){
        .rule{stroke-dasharray:120;animation:draw 1.2s .3s ease-out both}
        .lD{animation:inL .9s ease-out both}
        .lS{animation:inR .9s .2s ease-out both}
        .n1{animation:rise .8s .6s ease-out both}
        .n2{animation:rise .8s .85s ease-out both}
        .d1{animation:rise .8s 1.2s ease-out both}
        .d2{animation:rise .8s 1.4s ease-out both}
        .tg{animation:rise .7s 1.7s ease-out both}
        .tgr{animation:pulse 3.2s ease-in-out infinite}
        .sheen{animation:sweep 8s 2s linear infinite}
        .p{animation:float 6s ease-in-out infinite}
        .edge{animation:pulse 4s ease-in-out infinite}
      }
      @keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
      @keyframes inL{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
      @keyframes inR{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
      @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
      @keyframes sweep{from{opacity:1;transform:translateX(-400px) skewX(-20deg)}to{opacity:1;transform:translateX(1500px) skewX(-20deg)}}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-16px);opacity:.85}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1400" height="350" fill="url(#bg)"/>
  <rect width="1400" height="350" fill="url(#glow)"/>
  <rect class="sheen" x="0" y="0" width="170" height="350" fill="url(#sheenG)" opacity="0"/>
  <polygon points="0,0 150,0 0,150" fill="url(#corner)" opacity=".55"/>
  <polygon points="0,0 62,0 0,62" fill="#0061D8"/>
  <path d="M0 268H60Q76 268 88 280L138 350H0Z" fill="#0A3C8A" fill-opacity=".4" stroke="#2D8CFF" stroke-opacity=".6" stroke-width="2"/>
  <path d="M1180 0Q1192 22 1218 22H1400V0Z" fill="#0A4FB5" fill-opacity=".35"/>
  <path class="edge" d="M1180 0Q1192 22 1218 22H1400" fill="none" stroke="#1E90FF" stroke-width="3"/>
  <circle class="p" cx="560" cy="276" r="3" fill="#5BB8FF" opacity="0" style="animation-delay:0s"/>
  <circle class="p" cx="700" cy="300" r="2" fill="#5BB8FF" opacity="0" style="animation-delay:-2s"/>
  <circle class="p" cx="980" cy="296" r="3" fill="#5BB8FF" opacity="0" style="animation-delay:-4s"/>
  <circle class="p" cx="1120" cy="306" r="2" fill="#5BB8FF" opacity="0" style="animation-delay:-1s"/>
  <circle class="p" cx="1270" cy="236" r="3" fill="#5BB8FF" opacity="0" style="animation-delay:-3s"/>
  <circle class="p" cx="1310" cy="150" r="2" fill="#5BB8FF" opacity="0" style="animation-delay:-5s"/>
  <circle class="p" cx="520" cy="62" r="2" fill="#5BB8FF" opacity="0" style="animation-delay:-2.5s"/>
  <circle class="p" cx="800" cy="56" r="3" fill="#5BB8FF" opacity="0" style="animation-delay:-1.5s"/>
  <circle class="p" cx="1010" cy="84" r="2" fill="#5BB8FF" opacity="0" style="animation-delay:-3.5s"/>
  <g class="lD"><path fill="#EBF2FA" fill-rule="evenodd" d="M162 118H210A50 50 0 0 1 210 218H162ZM184 138H208A30 30 0 0 1 208 198H184Z"/></g>
  <g class="lS"><path fill="#009AFF" transform="translate(68 0) skewX(-14)" d="M235 118H315V138H255V158H315V218H235V198H295V178H235Z"/></g>
  <path class="rule" d="M380 112V232" stroke="#009AFF" stroke-opacity=".55" stroke-width="2"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="700">
    <text class="n1" x="414" y="164" font-size="44" fill="#FFFFFF" textLength="310" lengthAdjust="spacingAndGlyphs">Dairon Stiven</text>
    <text class="n2" x="414" y="214" font-size="44" fill="#009AFF" textLength="410" lengthAdjust="spacingAndGlyphs">Orejuela Palacios</text>
  </g>
  <path class="rule" d="M866 112V232" stroke="#009AFF" stroke-opacity=".55" stroke-width="2"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text class="d1" x="900" y="152" font-size="28" font-weight="600" fill="#FFFFFF" textLength="190" lengthAdjust="spacingAndGlyphs">Desarrollo web</text>
    <text class="d2" x="900" y="188" font-size="28" fill="#8FCBFF" textLength="330" lengthAdjust="spacingAndGlyphs">e ingeniería de software</text>
    <g class="tg" font-size="20" fill="#BFE3FF" text-anchor="middle">
      <rect class="tgr" x="900" y="204" width="84" height="34" rx="17" fill="none" stroke="#009AFF" stroke-width="2"/>
      <text x="942" y="228">React</text>
      <rect class="tgr" style="animation-delay:-1s" x="996" y="204" width="104" height="34" rx="17" fill="none" stroke="#009AFF" stroke-width="2"/>
      <text x="1048" y="228">Angular</text>
      <rect class="tgr" style="animation-delay:-2s" x="1112" y="204" width="72" height="34" rx="17" fill="none" stroke="#009AFF" stroke-width="2"/>
      <text x="1148" y="228">Vue</text>
    </g>
  </g>
</svg>
