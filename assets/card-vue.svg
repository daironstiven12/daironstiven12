<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">DevCode Academy (Vue)</title>
  <desc id="d">Landing page de una academia de programación con nueve secciones, diseño adaptable y formulario con validación. Tecnologías: Vue 3, Vite, JavaScript.</desc>
  <defs>
    <clipPath id="cp"><rect width="360" height="280" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A31"/><stop offset="1" stop-color="#020E1E"/></linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#009AFF" stop-opacity="0"/><stop offset=".5" stop-color="#5BB8FF"/><stop offset="1" stop-color="#009AFF" stop-opacity="0"/></linearGradient>
    <style>
      @media (prefers-reduced-motion:no-preference){
        .l,.tt{animation:rise .7s ease-out both}
        .sweep{animation:run 4.5s ease-in-out infinite}
        .dot{animation:pulse 2.4s ease-in-out infinite}
      }
      @keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
      @keyframes run{from{transform:translateX(-160px)}to{transform:translateX(380px)}}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    </style>
  </defs>
  <rect width="360" height="280" rx="18" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="358.5" height="278.5" rx="17.5" fill="none" stroke="#14407A" stroke-width="1.5"/>
  <g clip-path="url(#cp)"><rect class="sweep" x="0" y="0" width="160" height="3" fill="url(#sw)"/></g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <circle class="dot" cx="36" cy="44" r="5" fill="#4FC08D"/>
    <text x="50" y="50" font-size="16" font-weight="600" fill="#4FC08D">Vue</text>
    <path d="M316 34l14-14m0 0h-10m10 0v10" fill="none" stroke="#8FCBFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="tt" x="28" y="92" font-size="25" font-weight="700" fill="#FFFFFF">DevCode Academy</text>
    <g font-size="17" fill="#9FB8D6">
    <text class="l" style="animation-delay:0.50s" x="28" y="126">Landing page de una academia de</text>
    <text class="l" style="animation-delay:0.65s" x="28" y="150">programación con nueve secciones,</text>
    <text class="l" style="animation-delay:0.80s" x="28" y="174">diseño adaptable y formulario</text>
    <text class="l" style="animation-delay:0.95s" x="28" y="198">con validación.</text>
    </g>
    <rect x="28" y="226" width="65" height="30" rx="15" fill="none" stroke="#1E7BF0" stroke-opacity=".7" stroke-width="1.5"/>
    <text x="60" y="246" text-anchor="middle" font-size="14" fill="#BFE3FF">Vue 3</text>
    <rect x="103" y="226" width="57" height="30" rx="15" fill="none" stroke="#1E7BF0" stroke-opacity=".7" stroke-width="1.5"/>
    <text x="132" y="246" text-anchor="middle" font-size="14" fill="#BFE3FF">Vite</text>
    <rect x="170" y="226" width="104" height="30" rx="15" fill="none" stroke="#1E7BF0" stroke-opacity=".7" stroke-width="1.5"/>
    <text x="222" y="246" text-anchor="middle" font-size="14" fill="#BFE3FF">JavaScript</text>
  </g>
</svg>
